name: Publish Wellness OTA

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "style.css"
      - "app.js"
      - "features.js"
      - "wellness2.js"
      - "core-utils.js"
      - "hardening-core.js"
      - "hardening.js"
      - "data-foods.js"
      - "data-foods-ciqual.js"
      - "food-units-core.js"
      - "food-v42.js"
      - "daily-ux-core-v43.js"
      - "daily-ux-v43.js"
      - "smart-v44-core.js"
      - "smart-v44.js"
      - "cloud.js"
      - "ota-updater.js"
      - "ux-shell.js"
      - "native-bridge.js"
      - "manifest.webmanifest"
      - "sw.js"
      - "icons/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-web.mjs"
      - "scripts/build-ota.mjs"
      - "scripts/test-core.mjs"
      - "scripts/test-food-v42.mjs"
      - "scripts/test-daily-v43.mjs"
      - "scripts/test-smart-v44.mjs"
      - "scripts/import-ciqual-2025.mjs"
      - "scripts/normalize-v41.mjs"
      - ".github/workflows/ota-web-update.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wellness-ota-channel
  cancel-in-progress: true

jobs:
  publish:
    name: Verify and publish dedicated OTA channel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify source
        run: npm run verify

      - name: Create OTA package
        shell: bash
        run: |
          VERSION="4.4.0-${GITHUB_SHA::12}"
          rm -rf /tmp/wellness-ota
          mkdir -p /tmp/wellness-ota
          (
            cd www
            zip -qr /tmp/wellness-ota/wellness-web.zip .
          )

          cat > /tmp/wellness-ota/latest.json <<EOF
          {
            "version": "${VERSION}",
            "appVersion": "4.4.0",
            "schemaVersion": 4,
            "sourceCommit": "${GITHUB_SHA}",
            "url": "https://raw.githubusercontent.com/gregorylaporte1810-gif/mon-app-alimentation/ota/wellness-web.zip",
            "message": "Mise à jour automatique Wellness",
            "publishedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

      - name: Publish to dedicated ota branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git reset --hard
          git clean -fdx

          if git ls-remote --exit-code --heads origin ota >/dev/null 2>&1; then
            git fetch origin ota:ota
            git switch ota
          else
            git switch --orphan ota
            git rm -rf . >/dev/null 2>&1 || true
          fi

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/wellness-ota/latest.json ./latest.json
          cp /tmp/wellness-ota/wellness-web.zip ./wellness-web.zip
          git add -A

          if git diff --cached --quiet; then
            echo "Aucun changement OTA."
            exit 0
          fi

          git commit -m "chore: publish Wellness OTA ${GITHUB_SHA::12}"
          git push origin ota
