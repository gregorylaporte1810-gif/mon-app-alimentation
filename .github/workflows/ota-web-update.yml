name: Publish Wellness OTA

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "style.css"
      - "app.js"
      - "features.js"
      - "wellness2.js"
      - "core-utils.js"
      - "hardening-core.js"
      - "hardening.js"
      - "data-foods.js"
      - "cloud.js"
      - "ota-updater.js"
      - "ux-shell.js"
      - "native-bridge.js"
      - "manifest.webmanifest"
      - "sw.js"
      - "icons/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-web.mjs"
      - "scripts/build-ota.mjs"
      - "scripts/test-core.mjs"
      - "scripts/normalize-v41.mjs"
      - ".github/workflows/ota-web-update.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wellness-ota-main
  cancel-in-progress: true

jobs:
  publish:
    name: Verify, build and publish bootstrap OTA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify source
        run: npm run verify

      - name: Create OTA package
        shell: bash
        run: |
          VERSION="4.1.0-bootstrap-${GITHUB_SHA::12}"
          rm -rf ota
          mkdir -p ota
          (
            cd www
            zip -qr ../ota/wellness-web.zip .
          )

          cat > ota/latest.json <<EOF
          {
            "version": "${VERSION}",
            "appVersion": "4.1.0",
            "schemaVersion": 4,
            "url": "https://raw.githubusercontent.com/gregorylaporte1810-gif/mon-app-alimentation/main/ota/wellness-web.zip",
            "message": "Wellness 4.1 - fiabilisation",
            "publishedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

      # One final main-branch publication is intentional. It upgrades older
      # installed apps to the updater that knows the dedicated `ota` branch.
      - name: Commit bootstrap OTA bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ota/latest.json ota/wellness-web.zip

          if git diff --cached --quiet; then
            echo "Aucun changement OTA."
            exit 0
          fi

          git commit -m "chore: publish Wellness 4.1 bootstrap OTA [skip ci]"
          git push origin HEAD:main
