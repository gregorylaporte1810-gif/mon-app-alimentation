name: Publish Wellness OTA

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "theme-bootstrap.js"
      - "style.css"
      - "app.js"
      - "features.js"
      - "wellness2.js"
      - "core-utils.js"
      - "hardening-core.js"
      - "hardening.js"
      - "data-foods.js"
      - "data-foods-ciqual.js"
      - "food-units-core.js"
      - "food-v42.js"
      - "daily-ux-core-v43.js"
      - "daily-ux-v43.js"
      - "smart-v44-core.js"
      - "smart-v44.js"
      - "cloud.js"
      - "ota-updater.js"
      - "ux-shell.js"
      - "native-bridge.js"
      - "health-v5.js"
      - "health-v501-guard.js"
      - "polish-v51-core.js"
      - "polish-v51.js"
      - "final-v52-core.js"
      - "final-v52.js"
      - "viewport-v53.js"
      - "ux-v53-core.js"
      - "ux-v53.js"
      - "barcode-v532.js"
      - "barcode-v534.js"
      - "layout-v541.js"
      - "manifest.webmanifest"
      - "sw.js"
      - "icons/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-web.mjs"
      - "scripts/build-ota.mjs"
      - "scripts/test-core.mjs"
      - "scripts/test-food-v42.mjs"
      - "scripts/test-daily-v43.mjs"
      - "scripts/test-smart-v44.mjs"
      - "scripts/test-polish-v51.mjs"
      - "scripts/test-final-v52.mjs"
      - "scripts/test-v521-micro.mjs"
      - "scripts/test-v53.mjs"
      - "scripts/test-v532-barcode.mjs"
      - "scripts/test-v533-barcode.mjs"
      - "scripts/test-v534-barcode.mjs"
      - "scripts/test-v535-steps-keyboard.mjs"
      - "scripts/test-v54-maintenance.mjs"
      - "scripts/test-v541-layout.mjs"
      - "scripts/import-ciqual-2025.mjs"
      - "scripts/normalize-v41.mjs"
      - ".github/workflows/ota-web-update.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wellness-ota-channel
  cancel-in-progress: true

jobs:
  publish:
    name: Verify and publish dedicated OTA channel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify Node.js runtime
        run: node --version && npm --version

      - name: Install exact dependencies
        run: npm ci

      - name: Verify source
        run: npm run verify:ci

      - name: Create OTA package
        shell: bash
        run: |
          set -euo pipefail

          APP_VERSION="$(node -p "require('./package.json').version")"
          VERSION="${APP_VERSION}-${GITHUB_SHA::12}"

          rm -rf /tmp/wellness-ota
          mkdir -p /tmp/wellness-ota
          (
            cd www
            zip -qr /tmp/wellness-ota/wellness-web.zip .
          )

          SHA256="$(sha256sum /tmp/wellness-ota/wellness-web.zip | awk '{print $1}')"
          BUNDLE_SIZE="$(stat -c '%s' /tmp/wellness-ota/wellness-web.zip)"

          cat > /tmp/wellness-ota/latest.json <<EOF
          {
            "version": "${VERSION}",
            "appVersion": "${APP_VERSION}",
            "schemaVersion": 4,
            "sourceCommit": "${GITHUB_SHA}",
            "sha256": "${SHA256}",
            "size": ${BUNDLE_SIZE},
            "url": "https://raw.githubusercontent.com/gregorylaporte1810-gif/mon-app-alimentation/ota/wellness-web.zip",
            "message": "Mise à jour automatique Wellness",
            "publishedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("/tmp/wellness-ota/latest.json", "utf8"));
            if (!/^[0-9a-f]{40}$/i.test(manifest.sourceCommit)) throw new Error("sourceCommit OTA invalide");
            if (!/^[0-9a-f]{64}$/i.test(manifest.sha256)) throw new Error("SHA-256 OTA invalide");
            if (!Number.isInteger(manifest.size) || manifest.size <= 0) throw new Error("Taille OTA invalide");
            if (!manifest.version.startsWith(`${manifest.appVersion}-`)) throw new Error("Version OTA incohérente");
          '

      - name: Publish to dedicated ota branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git reset --hard
          git clean -fdx

          if git ls-remote --exit-code --heads origin ota >/dev/null 2>&1; then
            git fetch origin ota:ota
            git switch ota
          else
            git switch --orphan ota
            git rm -rf . >/dev/null 2>&1 || true
          fi

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/wellness-ota/latest.json ./latest.json
          cp /tmp/wellness-ota/wellness-web.zip ./wellness-web.zip
          git add -A

          if git diff --cached --quiet; then
            echo "Aucun changement OTA."
            exit 0
          fi

          git commit -m "chore: publish Wellness OTA ${GITHUB_SHA::12}"
          git push origin ota
