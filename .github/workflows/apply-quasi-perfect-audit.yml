name: Apply quasi-perfect audit hardening

on:
  push:
    branches:
      - fix/quasi-perfect-audit

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Apply source hardening
        run: |
          python3 scripts/apply-quasi-perfect-audit.py
          python3 scripts/fix-html-validation.py
          python3 scripts/fix-accessibility-runtime.py

      - name: Add quality test dependencies
        run: npm install --save-dev --save-exact @playwright/test@1.62.1 @axe-core/playwright@4.13.0 html-validate@11.10.0

      - name: Verify source and build
        run: npm run verify

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser and accessibility tests
        run: npm run test:e2e

      - name: Security and Capacitor checks
        run: |
          npm audit --audit-level=high
          npm run cap:doctor

      - name: Commit verified changes
        run: |
          set -euo pipefail
          # The GitHub Actions token cannot update workflow files. Restore only
          # those two generated workflow edits here; they are applied directly
          # through the authorized GitHub integration after this verified push.
          git checkout HEAD -- .github/workflows/quality.yml .github/workflows/ota-web-update.yml
          rm -f scripts/apply-quasi-perfect-audit.mjs
          rm -f scripts/apply-quasi-perfect-audit.py
          rm -f scripts/fix-html-validation.py
          rm -f scripts/fix-accessibility-runtime.py
          rm -f .github/workflows/apply-quasi-perfect-audit.yml
          rm -rf test-results playwright-report
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: polish quality privacy and accessibility"
          git push origin HEAD:fix/quasi-perfect-audit
