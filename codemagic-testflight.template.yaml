# TEMPLATE - à activer après connexion Apple Developer + App Store Connect
# Remplace YOUR_CODEMAGIC_INTEGRATION par le nom de ton intégration
# App Store Connect dans Codemagic.
#
# Bundle ID prévu :
# com.gregorylaporte1810.wellness

workflows:
  ios-testflight:
    name: Wellness - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: YOUR_CODEMAGIC_INTEGRATION

    environment:
      node: v22.23.2
      xcode: 26.4
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gregorylaporte1810.wellness
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App

    scripts:
      - name: Install exact npm dependencies
        script: npm ci

      - name: Verify project
        script: npm run verify:ci

      - name: Create and configure Capacitor iOS project
        script: |
          rm -rf ios
          node node_modules/@capacitor/cli/bin/capacitor add ios --packagemanager CocoaPods
          node node_modules/@capacitor/cli/bin/capacitor sync ios
          node scripts/configure-ios-native.mjs
          cd ios/App
          pod install --repo-update
          cd ../..
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSHealthShareUsageDescription" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSHealthUpdateUsageDescription" ios/App/App/Info.plist
          grep -q "com.apple.developer.healthkit" ios/App/App/App.entitlements

      - name: Apply Apple signing profiles
        script: |
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT"

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
