workflows:
  ios-simulator:
    name: Wellness - iOS Simulator
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      node: v22.23.2
      xcode: 26.4

    scripts:
      - name: Verify build provenance
        script: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "Wellness ${VERSION}"
          echo "Commit ${HEAD_SHA}"
          echo "Branch ${CM_BRANCH:-unknown}"

      - name: Install npm dependencies
        script: |
          npm ci

      - name: Verify project
        script: |
          npm run verify:ci

      - name: Create Capacitor iOS project
        script: |
          rm -rf ios
          node node_modules/@capacitor/cli/bin/capacitor add ios --packagemanager CocoaPods
          node node_modules/@capacitor/cli/bin/capacitor sync ios
          node scripts/configure-ios-native.mjs
          cd ios/App
          pod install --repo-update
          cd ../..
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSHealthShareUsageDescription" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSHealthUpdateUsageDescription" ios/App/App/Info.plist

      - name: Build unsigned iOS Simulator app
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - build/ios-simulator/Build/Products/Debug-iphonesimulator/App.app
      - /tmp/xcodebuild_logs/*.log

  ios-device-unsigned:
    name: Wellness - iPhone unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      node: v22.23.2
      xcode: 26.4

    scripts:
      - name: Verify build provenance
        script: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "Wellness ${VERSION}"
          echo "Commit ${HEAD_SHA}"
          echo "Branch ${CM_BRANCH:-unknown}"

          if [ "${CM_BRANCH:-}" = "main" ]; then
            git fetch origin main --depth=1
            MAIN_SHA="$(git rev-parse FETCH_HEAD)"
            if [ "${HEAD_SHA}" != "${MAIN_SHA}" ]; then
              echo "Refus du build : le commit sélectionné n'est pas le dernier commit de main."
              echo "Commit sélectionné : ${HEAD_SHA}"
              echo "Dernier main       : ${MAIN_SHA}"
              exit 1
            fi
          fi

      - name: Install npm dependencies
        script: |
          npm ci

      - name: Verify project
        script: |
          npm run verify:ci

      - name: Create Capacitor iOS project
        script: |
          rm -rf ios
          node node_modules/@capacitor/cli/bin/capacitor add ios --packagemanager CocoaPods
          node node_modules/@capacitor/cli/bin/capacitor sync ios
          node scripts/configure-ios-native.mjs
          cd ios/App
          pod install --repo-update
          cd ../..
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSHealthShareUsageDescription" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSHealthUpdateUsageDescription" ios/App/App/Info.plist

      - name: Build unsigned iPhone app
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            INFOPLIST_KEY_NSCameraUsageDescription="Wellness utilise la caméra pour scanner les codes-barres alimentaires." \
            build

      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          FULL_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          IPA_NAME="Wellness-${VERSION}-${SHORT_SHA}-unsigned.ipa"
          BUILD_INFO="Wellness-${VERSION}-${SHORT_SHA}-build.txt"
          APP_PATH="build/ios-device/Build/Products/Release-iphoneos/App.app"

          test -d "$APP_PATH"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSHealthShareUsageDescription" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSHealthUpdateUsageDescription" "$APP_PATH/Info.plist"
          /usr/bin/codesign --force --deep --sign - --entitlements ios/App/App/App.entitlements "$APP_PATH"
          /usr/bin/codesign -d --entitlements :- "$APP_PATH" 2>&1 | grep -q "com.apple.developer.healthkit"

          rm -rf build/unsigned-ipa
          mkdir -p build/unsigned-ipa/Payload
          cp -R "$APP_PATH" build/unsigned-ipa/Payload/App.app

          (
            cd build/unsigned-ipa
            zip -qry "../${IPA_NAME}" Payload
          )

          printf 'version=%s\ncommit=%s\nbranch=%s\ncodemagic_build_id=%s\n' \
            "$VERSION" \
            "$FULL_SHA" \
            "${CM_BRANCH:-unknown}" \
            "${CM_BUILD_ID:-unknown}" \
            > "build/${BUILD_INFO}"

          ls -lh "build/${IPA_NAME}"
          cat "build/${BUILD_INFO}"

    artifacts:
      - build/Wellness-*-unsigned.ipa
      - build/Wellness-*-build.txt
      - /tmp/xcodebuild_logs/*.log
